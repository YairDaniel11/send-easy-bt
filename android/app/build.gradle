apply plugin: 'com.android.application'

android {
    namespace 'il.sendeasy.bt'
    compileSdk 34

    defaultConfig {
        applicationId "il.sendeasy.bt"
        // minSdk קבוע (אנדרואיד 4.4, מכשירי מקשים), targetSdk עדכני
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    // חתימה קבועה (כדי שעדכונים יותקנו מעל הגרסה הקודמת): אם יש קובץ debug.keystore
    // (ב-CI הוא נכתב מסוד של המאגר, לא נשמר בקוד), משתמשים בו. אחרת: מפתח ה-debug הרגיל של Gradle.
    def fixedKeystore = file('debug.keystore')
    if (fixedKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile fixedKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    // שם APK קריא במקום app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${rootProject.name}-${variant.name}-${variant.versionName}.apk"
        }
    }
}

// בלי AndroidX/AppCompat ובלי תלויות חיצוניות, בכוונה: מכשירי מקשים ישנים.
