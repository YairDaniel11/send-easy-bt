name: j2me

# בונה את אפליקציית ה-JAR למכשירי נוקיה. רץ ידנית או כשקוד ה-J2ME משתנה, ומעלה את הקובץ כ-artifact (לא מפרסם Release).
on:
  push:
    paths:
      - 'j2me/**'
      - '.github/workflows/j2me.yml'
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: בניית JAR
        run: VERSION=0.1.${{ github.run_number }} bash j2me/build.sh

      - name: בדיקת ה-JAR
        run: |
          rm -rf /tmp/chk && mkdir /tmp/chk && cd /tmp/chk && unzip -q "$GITHUB_WORKSPACE"/j2me/build/app.jar
          for c in $(find . -name '*.class'); do echo "$c: $(javap -v "$c" | grep -m1 'major version')"; done
          if grep -rq StringBuilder .; then echo "StringBuilder לא קיים ב-CLDC"; exit 1; fi
          echo "preverify (StackMap):"; grep -rl StackMap . || true
          cat META-INF/MANIFEST.MF

      - uses: actions/upload-artifact@v4
        with:
          name: SendEasyBT-jar
          path: j2me/dist/*.jar
