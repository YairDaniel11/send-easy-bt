name: android

# בונה APK של אפליקציית האנדרואיד ומפרסם Release, רק כשהקוד שלה משתנה.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: מפתח חתימה קבוע (אם הוגדר סוד במאגר)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/debug.keystore; echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV; fi

      - name: מספר גרסה
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" app/build.gradle

      - name: בניית APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: send-easy-bt-android
          path: android/app/build/outputs/apk/debug/*.apk

      - name: פרסום גרסה
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release create "android-v0.1.${{ github.run_number }}" android/app/build/outputs/apk/debug/*.apk \
            --title "שליחה קלה - BT לאנדרואיד 0.1.${{ github.run_number }}" \
            --notes "APK לבדיקה (debug). מינימום אנדרואיד 4.4. מתקינים מתוך הטלפון או מקבלים דרך התוכנה במחשב." \
            --latest=false